# Single-host deployment. Development quickstart: `make backend` + `make frontend`
# is simpler. Fill TELEGRAM_* / API_KEY via a local .env file (never commit it).
services:
  backend:
    build:
      context: ./backend
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY app ./app
        CMD ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [.env]
    environment:
      DATABASE_URL: sqlite:///./data/signals.db
    volumes:
      - signal_data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:22-alpine AS build
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY . .
        RUN npm run build
        FROM node:22-alpine
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci --omit=dev || true
        COPY --from=build /app/dist ./dist
        COPY vite.config.ts ./
        CMD ["npx", "vite", "preview", "--host", "0.0.0.0", "--port", "4173"]
    ports:
      - "4173:4173"
    depends_on:
      - backend

  # Optional managed-style Postgres: docker compose --profile postgres up
  # then set DATABASE_URL=postgresql+psycopg://signals:signals@db:5432/signals and
  # add psycopg[binary] to backend requirements.
  db:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signals
      POSTGRES_USER: signals
      POSTGRES_PASSWORD: signals
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  signal_data:
  pg_data:
